server.address=127.0.0.1
server.port=8096
spring.application.name=e5-browser-isolated
spring.datasource.url=jdbc:h2:mem:e5browser;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.main.banner-mode=off
platform.subsystem-scan-package=com.example.generated
rls.dimension-scan-package=com.example.generated
settings.scan-package=org.ipro.e5browser.settings
rls.write-boundary.enforced=true
ipro.telemetry.enabled=false
ipro.telemetry.db-journal=false
vaadin.launch-browser=false
logging.level.org.atmosphere=warn