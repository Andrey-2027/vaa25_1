    const rows=e.fields.map(f=>`<div class="er-edit-row"><span><code>${f.name}</code><span class="er-muted er-small">${f.type}</span></span><label class="er-field">Подпись<input type="text" data-modify-label="${f.name}" aria-label="Подпись реквизита ${f.name}" value="${escape(entry.labels[f.name]??f.label)}"></label></div>`).join('');
    const summary=changed.length?props(changed.map(f=>[f.name,`${escape(f.label)} → ${escape(entry.labels[f.name])}`])):'<p class="er-muted">Изменений нет.</p>';
    return `<header class="er-card-heading"><div class="er-line er-card-top"><button type="button" class="er-button" data-action="back">${icon('arrow-left')}К реестру</button><span class="er-muted er-small">${e.code}</span></div><h1>Изменение структуры · ${e.item}</h1></header><section class="er-modify-body"><h3>Реквизиты сущности</h3><div class="er-edit-fields">${rows}</div><button type="button" class="er-button" data-action="preview-modify">Показать изменения</button><div class="er-change-summary" aria-live="polite" ${entry.showChanges?'':'hidden'}>${summary}</div></section><footer class="er-footer">Пример данных · Редактор структуры</footer>`;
  }
  function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:15,height:15}});}
  function render(app) {
    const s=states.get(app),entry=activeWorkspace(s);
    const content=s.view==='registry'?`${toolbar(s)}<div class="er-body" data-results></div>`:s.view==='card'?card({...s,selected:entry.entity,tab:entry.section}):s.view==='modify'?modifyPage(entry):s.view==='global'?globalPage():createPage({...s,createKind:entry.kind,createDraft:entry.draft});
    app.innerHTML=`${workspaceHeader(s)}<div class="er-body">${content}</div>`;
    if(s.view==='registry')updateResults(app);else icons();
  }
  function ensureSelection(s) {const list=filtered(s);if(!list.some(e=>e.id===s.selected))s.selected=list.length?list[0].id:'group-nom';}
  function setMenu(app,open,focus) {
    const s=states.get(app);s.createMenuOpen=open;
    const trigger=app.querySelector('.er-create-trigger');
    const menu=app.querySelector('.er-create-menu');
    if(!trigger||!menu)return;
    trigger.setAttribute('aria-expanded',String(open));menu.hidden=!open;
    if(open&&focus){const items=menu.querySelectorAll('button');items[focus==='last'?items.length-1:0].focus();}
    if(!open&&focus==='trigger')trigger.focus();
  }
  apps.forEach(app=>{
    app.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button||!app.contains(button))return;
      const s=states.get(app);
      if(button.dataset.workspaceActivate){setMenu(app,false);activateWorkspace(s,button.dataset.workspaceActivate);render(app);save();return;}
      if(button.dataset.workspaceClose){const id=button.dataset.workspaceClose;s.entries=s.entries.filter(e=>e.id!==id);if(s.activeId===id)activateWorkspace(s,'registry');render(app);save();return;}
      if(button.dataset.action==='create-menu'){setMenu(app,!s.createMenuOpen,s.createMenuOpen?'trigger':'first');return;}
      if(button.dataset.createKind){s.createKind=button.dataset.createKind;openWorkspace(s,'create',null,s.createKind);render(app);save();return;}
      setMenu(app,false);
      if(button.dataset.select){s.selected=button.dataset.select;s.mobileDetail=true;updateResults(app);save();return;}
      if(button.dataset.open){openWorkspace(s,'card',button.dataset.open);}
      else if(button.dataset.modify){openWorkspace(s,'modify',button.dataset.modify);}
      else if(button.dataset.tab){const entry=activeWorkspace(s);if(entry&&entry.mode==='card')entry.section=button.dataset.tab;}
      else if(button.dataset.group){const name=button.dataset.group;s.closed=s.closed.includes(name)?s.closed.filter(x=>x!==name):[...s.closed,name];updateResults(app);save();return;}
      else if(button.dataset.action){
        const action=button.dataset.action;
        if(action==='back')activateWorkspace(s,'registry');
        if(action==='list')s.mobileDetail=false;
        if(action==='global')openWorkspace(s,'global');
        if(action==='preview-modify'){const entry=activeWorkspace(s);if(entry&&entry.mode==='modify')entry.showChanges=true;}
        if(action==='reset'||action==='reset-all'){s.kind='';s.subsystem='';s.query='';s.closed=[];s.mobileDetail=false;ensureSelection(s);}
      } else return;
      render(app);save();
    });
    app.addEventListener('input',event=>{
      if(event.target.dataset.createField){const entry=activeWorkspace(states.get(app));if(entry?.mode==='create'){entry.draft=entry.draft||{};entry.draft[event.target.dataset.createField]=event.target.value;save();}return;}
      if(event.target.dataset.modifyLabel){const s=states.get(app),entry=activeWorkspace(s);if(entry?.mode==='modify'){entry.labels[event.target.dataset.modifyLabel]=event.target.value;entry.showChanges=false;app.querySelector('.er-change-summary').hidden=true;save();}return;}
      if(event.target.dataset.field!=='query')return;
      const s=states.get(app);s.query=event.target.value;s.closed=[];s.mobileDetail=false;ensureSelection(s);updateResults(app);save();
    });
    app.addEventListener('change',event=>{
      if(event.target.dataset.createField)return;
      const key=event.target.dataset.field;if(!key||key==='query')return;
      const s=states.get(app);s[key]=event.target.type==='checkbox'?event.target.checked:event.target.value;
      s.closed=[];s.mobileDetail=false;ensureSelection(s);updateResults(app);save();
    });
    app.addEventListener('keydown',event=>{
      const s=states.get(app);
      if(event.key==='Escape'&&s.createMenuOpen){event.preventDefault();setMenu(app,false,'trigger');return;}
      if(event.target.closest('.er-create-trigger')&&['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();setMenu(app,true,event.key==='ArrowUp'?'last':'first');return;}
      if(!event.target.closest('.er-menu-item')||!['ArrowDown','ArrowUp','Home','End'].includes(event.key))return;
      event.preventDefault();
      const items=Array.from(app.querySelectorAll('.er-menu-item'));
      const index=items.indexOf(event.target.closest('.er-menu-item'));
      const next=event.key==='Home'?0:event.key==='End'?items.length-1:(index+(event.key==='ArrowDown'?1:-1)+items.length)%items.length;
      items[next].focus();
    });
    render(app);
  });
  document.addEventListener('click',event=>{
    apps.forEach(app=>{if(states.get(app).createMenuOpen&&!app.querySelector('.er-create')?.contains(event.target)){setMenu(app,false);}});
  });
  function applyDesign(){apps.forEach(app=>{app.style.setProperty('--er-row',`${settings.rowHeight}px`);app.dataset.code=String(settings.showClass);});}
  applyDesign();
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root,onChange:applyDesign});
    tweak.addSlider(settings,'rowHeight',{label:'Высота строки реестра',min:38,max:58,step:2,unit:'px'});
    tweak.addToggle(settings,'showClass',{label:'Имя класса в дереве'});
  }
  window.addEventListener('openai:set_globals',event=>{
    if(!event.detail||!event.detail.globals||!event.detail.globals.widgetState)return;
    const incoming=event.detail.globals.widgetState.privateContent?.registryTree;
    if(incoming&&JSON.stringify(incoming)===lastWrittenState)return;
    restore(event.detail.globals.widgetState);apps.forEach(render);applyDesign();
  });
})();
</script>
