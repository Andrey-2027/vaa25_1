      new CustomEvent(&quot;openai:set_globals&quot;, {

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,

    &quot;message&quot;,
    (event) =&gt; {

      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||

        return;
      }
      apply(stopMessagePropagation, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

  function updateResults(app) {

  const tabs = [&#x27;Основные&#x27;,&#x27;Данные&#x27;,&#x27;Родитель / Владельцы&#x27;,&#x27;Представление&#x27;,&#x27;Формы&#x27;,&#x27;Обработчики&#x27;,&#x27;Нумерация&#x27;,&#x27;Диагностика&#x27;];

  function globalPage() {
