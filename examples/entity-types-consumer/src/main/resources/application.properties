spring.application.name=entity-types-consumer
server.address=127.0.0.1
server.port=${ET5_PORT:8095}
spring.datasource.url=${ET5_JDBC_URL:jdbc:h2:mem:et5;DB_CLOSE_DELAY=-1}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=${ET5_DDL:create-drop}
spring.jpa.open-in-view=false
platform.subsystem-scan-package=com.example.entitytypes
rls.dimension-scan-package=com.example.entitytypes
settings.scan-package=com.example.entitytypes.settings
rls.write-boundary.enforced=true
consumer.demo-password=${ET5_DEMO_PASSWORD:et5-local-only}
et5.fixtures.enabled=true
et5.grant-denied=${ET5_GRANT_DENIED:false}
ipro.telemetry.enabled=true
ipro.telemetry.db-journal=false
ipro.telemetry.app-name=entity-types-consumer
