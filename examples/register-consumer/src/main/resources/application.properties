spring.application.name=register-consumer
spring.main.web-application-type=none
spring.datasource.url=${REGISTER_CONSUMER_JDBC_URL:jdbc:h2:mem:registerconsumer;DB_CLOSE_DELAY=-1}
spring.datasource.username=${REGISTER_CONSUMER_DB_USER:sa}
spring.datasource.password=${REGISTER_CONSUMER_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${REGISTER_CONSUMER_DDL:create-drop}
spring.jpa.open-in-view=false
platform.subsystem-scan-package=com.example.registerconsumer
settings.scan-package=com.example.registerconsumer
rls.dimension-scan-package=com.example.registerconsumer.model
rls.write-boundary.enforced=true
ipro.telemetry.enabled=false
consumer.demo-password=${REGISTER_CONSUMER_DEMO_PASSWORD:register-consumer-local-only}
