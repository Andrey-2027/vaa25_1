# Explicit PostgreSQL profile. G1R.1 declares it but does not accept it: the physical
# schema/UNIQUE/FK gate is R7/REG-A3, not this package.
spring.datasource.url=${REGISTER_CONSUMER_JDBC_URL:jdbc:postgresql://localhost:5432/register_consumer}
spring.datasource.username=${REGISTER_CONSUMER_DB_USER:register_consumer}
spring.datasource.password=${REGISTER_CONSUMER_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${REGISTER_CONSUMER_DDL:validate}
