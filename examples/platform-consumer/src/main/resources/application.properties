spring.application.name=platform-consumer
server.port=${CONSUMER_PORT:8091}
server.address=127.0.0.1
spring.datasource.url=${CONSUMER_JDBC_URL}
spring.datasource.username=${CONSUMER_DB_USERNAME}
spring.datasource.password=${CONSUMER_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
platform.subsystem-scan-package=com.example.materialrequests
rls.dimension-scan-package=com.example.materialrequests
settings.scan-package=com.example.materialrequests.settings
rls.write-boundary.enforced=true
consumer.demo-password=${CONSUMER_DEMO_PASSWORD}
consumer.fixtures.enabled=${CONSUMER_FIXTURES_ENABLED:false}
ipro.telemetry.enabled=true
ipro.telemetry.db-journal=true
ipro.telemetry.app-name=platform-consumer
