# Only the launcher-owned disposable integration databases may be used with create-drop.
spring.datasource.url=${CONSUMER_TEST_JDBC_URL}
spring.datasource.username=${CONSUMER_DB_USERNAME}
spring.datasource.password=${CONSUMER_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
consumer.fixtures.enabled=true
