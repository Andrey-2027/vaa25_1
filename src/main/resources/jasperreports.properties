# Дефолты JasperReports 7 для всего приложения (UDR и движок JR).
# DejaVu Sans из jasperreports-fonts покрывает кириллицу; встраивание сабсета
# в PDF обязательно (см. ReportJR-Jpql-Plan.md, Р6 и Dr7GoldenSmokeTest).
# В JR7 имена изменились относительно JR6 (были default.fontname/fontsize,
# pdf.embedded) — см. config.reference.html.
net.sf.jasperreports.default.font.name=DejaVu Sans
net.sf.jasperreports.default.font.size=10
net.sf.jasperreports.default.pdf.embedded=true
