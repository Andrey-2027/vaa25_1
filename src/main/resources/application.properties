spring.application.name=Owner Pl Vaadin 25
server.port=8080

# Local connections and paths are stored outside the JAR and outside Git.
# Copy config/application-local.example.properties to
# config/application-local.properties and fill in the local values.
spring.config.import=optional:file:./config/application-local.properties

# postgreSql Database (file-based, persists between restarts)
spring.datasource.driverClassName=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Временно сохраняем OSIV: текущие Vaadin-формы ещё работают с JPA entities и
# могут читать LAZY-связи во время обработки запроса. Пересмотреть на этапе C
# после введения FetchPlan/data-access boundary.
spring.jpa.open-in-view=true
# Встроенная статистика Hibernate по умолчанию выключена. Собственная телеметрия
# использует SqlStatementListener/SqlStatementInspector и от неё не зависит.
# Для разовой диагностики включайте параметр в application-local.properties.
spring.jpa.properties.hibernate.generate_statistics=false
# Batch-фетчинг для LAZY @ManyToOne/@ManyToMany: вместо N отдельных SELECT на каждую
# ссылку (например, при рендере ItemTable/EntityField вне запроса грида, который уже
# покрыт EntityGraph на canonical read boundary) Hibernate соберёт их
# в запросы вида "WHERE id IN (?,?,?...)" по 25 за раз.
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# SQL initialization (disabled, handled by DataInitializer)
spring.sql.init.mode=never
platform.navigation.enabled=false
spring.jpa.defer-datasource-initialization=true

# ===== Телеметрия: инструментация Hibernate (Веха 2) =====
# Per-сессионный слушатель JDBC-стейтментов: реальное время SQL -> фрейм операции
spring.jpa.properties.hibernate.session.events.auto=org.ipro.telemetry.core.SqlStatementListener
# StatementInspector: захват SQL-текста для N+1-детекции (только подсчёт, не тайминг)
spring.jpa.properties.hibernate.session_factory.statement_inspector=org.ipro.telemetry.core.SqlStatementInspector
# Встроенные медленные SQL (SELECT): логируются в org.hibernate.SQL_SLOW с MDC (traceId/user)
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=${ipro.telemetry.sql-threshold-ms:100}
# Field-level аудит (Этап 10): Pre*EventListener на события flush'а (Integrator)
spring.jpa.properties.hibernate.integrator_provider=org.ipro.telemetry.core.FieldAuditIntegratorProvider

# ===== Телеметрия (org.ipro.telemetry) =====
ipro.telemetry.enabled=true
ipro.telemetry.db-journal=true
ipro.telemetry.method-threshold-ms=200
ipro.telemetry.sql-threshold-ms=100
ipro.telemetry.n1-threshold=5
ipro.telemetry.l0-window-seconds=60
ipro.telemetry.trace-default-minutes=10
ipro.telemetry.include-params=false
ipro.telemetry.queue-size=10000
ipro.telemetry.frame-limit=500
ipro.telemetry.file-dir=${LOG_DIR:logs}
ipro.telemetry.trace-dir=${LOG_DIR:logs}/traces
ipro.telemetry.app-name=${spring.application.name}
ipro.telemetry.sql.redact-fields=password,token,secret
# Field-level аудит: whitelist сущностей (по умолчанию — бывшие @Audited Envers) и redaction
ipro.telemetry.field-audit.entities=Nomenclature,ReceivingDocument,ReceivingDocumentItem,PrdSpec,PrdSpecMtr,PrdSpecOper,Workshop,UnitOfMeasurement,Journal,GridFormView,Oper,NumberingRule,SettingValue
ipro.telemetry.field-audit.redact-fields=password,token,secret
ipro.telemetry.retention.events-days=90
ipro.telemetry.retention.security-days=365
ipro.telemetry.retention.stats-days=365
ipro.telemetry.retention.trace-hours=72
# Дефолт 0 = не чистить (комплаенс-параметр; срок — решение заказчика)
ipro.telemetry.retention.field-audit-days=0

# ===== JR (JasperReports .jrxml): каталог файлов шаблонов =====
# Отдельное хранилище - жизненные циклы движков независимы.
# Можно сетевой путь UNC (//server/share/jrxml). Переопределяется переменной JRXML_FILESTORE_DIR.
jrxml.fileStoreDir=${JRXML_FILESTORE_DIR:jrxml-files}
# Лимит колонок SELECT для JR-отчетов (pixel-perfect шире ad-hoc; план Ф1.2)
jrxml.max-columns=50


# ===== RLS: scan package (step 8b: no default in module, set by application) =====
rls.dimension-scan-package=org.ip

# ===== RLS: финальная граница записи для типов без RLS (ADR-0017 §9) =====
# enforced=true — Hibernate flush требует зафиксированную авторизацию canonical write для
# типов с canonical write handle. Включение возможно только вместе с миграцией мест прямой
# записи (AttributeValueService, тестовые фикстуры) — без неё эти места откажут на commit.
# Пока false, старт печатает WARN со списком незакрытых типов, а не молчит.
rls.write-boundary.enforced=false
# Пошаговое вооружение: типы мигрируют по одному, поэтому здесь называются те, для которых
# граница уже обязательна (полные имена классов через запятую). Имя без canonical write
# handle останавливает старт. Названы типы, у которых прямых записей в production-коде не
# осталось: Role/User (демо-наполнение и пилотная фикстура пишут их canonical path),
# AttributeType (его пишет только generic item-форма) и AttributeValue (ADR-0019: создание —
# canonical create, переименование — именованная операция владельца; generic update/delete у
# типа не публикуются by design). Вооружение ничего не меняет для легальных путей — они и так
# проходят тот же preflight, — но закрывает обход. Остальные типы сняты: их перечисляет старт,
# а не этот список.
# P-U: formerly protected CHECK_ONLY ENTITY types retain their final write boundary after
# removal of the legacy RLS declarations. Their authorization now comes from canonical C5.
rls.write-boundary.enforced-types=org.ip.model.AttributeType,org.ip.model.AttributeValue,org.ip.model.Role,org.ip.model.User,org.ip.model.AccountingObjectInstallation,org.ip.model.AccountingObjectCorrection,org.ip.model.NomenclatureAccountingObject

# ===== Платформенный scan-контур (D3: defaults нет в платформе, задаёт приложение) =====
platform.subsystem-scan-package=org.ip
settings.scan-package=org.ip.settings

# ===== Глубокие ссылки (E2.3, ADR-0009) =====
# Приложение объявляет route host: MainLayout несёт шаблоны адресов форм
# (/records/{entityKey}/{id}, /lists/{entityKey}). Объявление нужно потому, что
# "есть ли шаблоны" из бинов не видно — @RouteAlias это аннотация класса.
# С включённым свойством старт проверяет, что приложение предоставило UI-scoped
# WorkspaceGateway: прямой адрес всегда открывает форму в Workspace, и без рабочей
# области каждая скопированная ссылка открывалась бы в "открывать некуда".
ipro.form.route-host.enabled=true

# ??? ????????? ??????? Rest
platform.rest.read.enabled=true
platform.rest.web.enabled=true

# UniDR: shared JSON definitions; use an absolute persistent directory in deployment.
app.unidr.file-store-dir=reports/unidr
app.unidr.enabled=true