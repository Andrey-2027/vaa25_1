spring.application.name=?????? ?????????? Vaadin 25
server.port=8080

# postgreSql Database (file-based, persists between restarts)
spring.datasource.url=jdbc:postgresql://localhost:5432/DBVaa25
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=1

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL initialization (disabled, handled by DataInitializer)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
