# Полностью своя конфигурация для тестов (не merge с main/application.properties —
# файл с тем же именем на тестовом classpath замещает его целиком, а не дополняет).
# Hibernate выбирает JSON-тип по dialect: jsonb в PostgreSQL и json в H2.
# JDBC writer также выбирает синтаксис параметра по database product.
# Тесты работают в профиле test с разрешённым demo-наполнением (см. DAC-19):
# DataInitializer регистрируется (и мокается через @MockitoBean), production-бины
# профилей при этом не затрагиваются — других @Profile в проекте нет.
spring.profiles.active=test
app.demo-data.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.defer-datasource-initialization=true

# RLS-канарейка (Фаза 6): в тестах strict-режим с коллектором нарушений; инспектор
# регистрируется здесь, т.к. тестовая конфигурация замещает основную целиком.
spring.jpa.properties.hibernate.session_factory.statement_inspector=org.ipro.telemetry.core.SqlStatementInspector
rls.guard.strict=true
