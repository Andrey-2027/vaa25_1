# Полностью своя конфигурация для тестов (не merge с main/application.properties —
# файл с тем же именем на тестовом classpath замещает его целиком, а не дополняет).
# Hibernate выбирает JSON-тип по dialect: jsonb в PostgreSQL и json в H2.
# JDBC writer также выбирает синтаксис параметра по database product.
# Тесты работают в профиле test с разрешённым demo-наполнением (см. DAC-19):
# DataInitializer регистрируется (и мокается через @MockitoBean), production-бины
# профилей при этом не затрагиваются — других @Profile в проекте нет.
spring.profiles.active=test
app.demo-data.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.defer-datasource-initialization=true

# RLS-канарейка (Фаза 6): в тестах strict-режим с коллектором нарушений; инспектор
# регистрируется здесь, т.к. тестовая конфигурация замещает основную целиком.
spring.jpa.properties.hibernate.session_factory.statement_inspector=org.ipro.telemetry.core.SqlStatementInspector
rls.guard.strict=true

# C3.6: измерения графа загрузки. Статистика Hibernate нужна тестам, которые сравнивают
# количество запросов «до/после» плана и проверяют, что detached-рендер не инициирует
# lazy load. Сбор статистики не меняет SQL, только счётчики.
spring.jpa.properties.hibernate.generate_statistics=true

# RLS: scan package (step 8b: no default in module, set by configuration).
# NOTE: this file replaces main application.properties on the test classpath,
# so the key must be duplicated here (same as rls.guard.strict above).
rls.dimension-scan-package=org.ip
platform.subsystem-scan-package=org.ip
settings.scan-package=org.ip.settings
