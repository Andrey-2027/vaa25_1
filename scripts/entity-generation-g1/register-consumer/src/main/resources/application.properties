spring.application.name=entity-generation-g1-harness
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.datasource.url=jdbc:h2:mem:g1harness;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

platform.subsystem-scan-package=com.example.generated.harness
rls.dimension-scan-package=com.example
settings.scan-package=com.example.generated.harness.settings
rls.write-boundary.enforced=true

ipro.telemetry.enabled=false
ipro.telemetry.db-journal=false
